# zepLinux tests on ESP32 family (process / thread API)

# --- ztest ---
CONFIG_ZTEST=y
CONFIG_ZTEST_VERIFY_RUN_ALL=y

# --- zepLinux process model ---
CONFIG_PROCESS_MODEL=y
CONFIG_MAX_PROCESS_COUNT=8
CONFIG_MAX_FD_PER_PROCESS=8

# --- shell disabled (needs zepLinux signal/kill for Ctrl+C) ---

# --- memory / threads ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_DYNAMIC_THREAD=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_NUM_PREEMPT_PRIORITIES=15

CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y
